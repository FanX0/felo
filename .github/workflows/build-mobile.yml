name: Build Mobile Apps (Android & iOS)

on:
  workflow_dispatch:
  push:
    branches: [main, master, backup-full, clean-main]
    paths:
      - 'src/renderer/**'
      - 'capacitor.config.ts'
      - 'android/**'
      - 'ios/**'
      - '.github/workflows/build-mobile.yml'

jobs:
  # ─── ANDROID BUILD ──────────────────────────────────────────────────────────
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install dependencies
        run: npm ci

      - name: Compile Web SPA Bundle
        run: npm run build:web

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Build Android Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: felo-android-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

  # ─── IOS BUILD ──────────────────────────────────────────────────────────────
  build-ios:
    name: Build iOS IPA & App Bundle
    runs-on: macos-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Select Xcode Version
        run: sudo xcode-select -s /Applications/Xcode_15.4.app || sudo xcode-select -s /Applications/Xcode.app

      - name: Install dependencies
        run: npm ci

      - name: Compile Web SPA Bundle
        run: npm run build:web

      - name: Sync Capacitor iOS
        run: npx cap sync ios

      - name: Build iOS Archive & Sideload IPA
        run: |
          cd ios/App
          # Build .xcarchive without code signing requirements (ready for AltStore/SideStore/Sideloadly)
          xcodebuild archive \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -archivePath build/App.xcarchive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

          # Create installable IPA payload
          mkdir -p build/Payload
          cp -r build/App.xcarchive/Products/Applications/App.app build/Payload/
          cd build
          zip -r Felo-iOS.ipa Payload/
          cd ../../

      - name: Upload iOS IPA (Sideload / AltStore / SideStore)
        uses: actions/upload-artifact@v4
        with:
          name: felo-ios-ipa
          path: ios/App/build/Felo-iOS.ipa
          retention-days: 14
