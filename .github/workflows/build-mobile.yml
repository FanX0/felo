name: Build Mobile Apps (Android & iOS)

on:
  workflow_dispatch:
  push:
    branches: [main, master, backup-full, clean-main]
    paths:
      - 'src/renderer/**'
      - 'capacitor.config.ts'
      - 'android/**'
      - 'ios/**'
      - '.github/workflows/build-mobile.yml'

jobs:
  # ─── ANDROID BUILD ──────────────────────────────────────────────────────────
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Install dependencies
        run: npm ci

      - name: Compile Web SPA Bundle
        run: npm run build:web

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Build Android APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          if [ ! -f app/build/outputs/apk/debug/Felo.apk ]; then
            cp app/build/outputs/apk/debug/*.apk app/build/outputs/apk/debug/Felo.apk
          fi

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: Felo-Android-APK
          path: android/app/build/outputs/apk/debug/Felo.apk
          retention-days: 14

  # ─── IOS BUILD ──────────────────────────────────────────────────────────────
  build-ios:
    name: Build iOS IPA & App Bundle
    runs-on: macos-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Select Xcode Version
        run: sudo xcode-select -s /Applications/Xcode_15.4.app || sudo xcode-select -s /Applications/Xcode.app

      - name: Install dependencies
        run: npm ci

      - name: Compile Web SPA Bundle
        run: npm run build:web

      - name: Sync Capacitor iOS
        run: npx cap sync ios

      - name: Build iOS Archive & Sideload IPA
        run: |
          cd ios/App
          # Build .xcarchive without code signing requirements (ready for AltStore/SideStore/Sideloadly)
          xcodebuild archive \
            -project App.xcodeproj \
            -scheme App \
            -destination 'generic/platform=iOS' \
            -configuration Release \
            -archivePath build/App.xcarchive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

          # Create installable IPA payload
          mkdir -p build/Payload
          cp -r build/App.xcarchive/Products/Applications/App.app build/Payload/
          cd build
          zip -r Felo.ipa Payload/
          cp Felo.ipa Felo-iOS.ipa
          cd ../../

      - name: Upload iOS IPA (Sideload / AltStore / SideStore)
        uses: actions/upload-artifact@v4
        with:
          name: Felo-iOS-IPA
          path: ios/App/build/Felo.ipa
          retention-days: 14

  # ─── GITHUB RELEASES (APK & IPA DEPLOYMENT) ─────────────────────────────────
  release:
    name: Publish Mobile App to GitHub Releases
    needs: [build-android, build-ios]
    runs-on: ubuntu-latest
    if: |
      always() &&
      (needs.build-android.result == 'success' || needs.build-ios.result == 'success') &&
      (github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/clean-main' || github.ref == 'refs/heads/backup-full')
    permissions:
      contents: write
    steps:
      - name: Download Android APK
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: Felo-Android-APK
          path: release-assets

      - name: Download iOS IPA
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: Felo-iOS-IPA
          path: release-assets

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'latest' }}
          name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'Felo Mobile - Latest Build' }}
          body: |
            ### 📱 Felo Mobile Releases

            Automated cross-platform build from `${{ github.sha }}` (${{ github.ref_name }}):
            - **Android APK**: Direct sideload package (`Felo.apk`)
            - **iOS IPA**: Sideload payload package (`Felo.ipa`) for AltStore, SideStore, Sideloadly, or TrollStore.

            For iOS users without sideload tools, use Safari **"Add to Home Screen"** on [felo.feloapp.workers.dev](https://felo.feloapp.workers.dev).
          prerelease: false
          files: |
            release-assets/Felo.apk
            release-assets/Felo.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
