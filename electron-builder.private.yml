appId: com.felo.app.private
productName: Felo (Private)
directories:
  buildResources: build
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
  - '!{.claude,.agents,scripts,scratch,docs,coverage,tests,android,supabase,.vercel,.zed}/**/*'
  - '!dist/**/*'
  - '!**/*.log'
asarUnpack:
  - resources/**
extraResources:
  - from: resources/music-presence
    to: music-presence
  - from: resources/downloader
    to: downloader
  - from: resources/hermes
    to: hermes
    filter:
      - '**/*'
      - '!**/__pycache__/**'
      - '!**/*.pyc'
  - from: resources/providers
    to: providers
win:
  icon: build/icon.ico
  executableName: Felo
protocols:
  - name: Felo OAuth callback
    schemes:
      - felo
nsis:
  include: build/installer.nsh
  artifactName: Felo-Private-${version}-Setup.${ext}
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  installerHeaderIcon: build/icon.ico
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: false
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
mac:
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    - NSCameraUsageDescription: Application requests access to the device's camera.
    - NSMicrophoneUsageDescription: Application requests access to the device's microphone.
    - NSDocumentsFolderUsageDescription: Application requests access to the user's Documents folder.
    - NSDownloadsFolderUsageDescription: Application requests access to the user's Downloads folder.
  notarize: false
dmg:
  artifactName: ${name}-Private-${version}.${ext}
linux:
  target:
    - AppImage
    - snap
    - deb
  maintainer: electronjs.org
  category: Utility
appImage:
  artifactName: ${name}-Private-${version}.${ext}
npmRebuild: false
publish:
  provider: generic
  url: https://example.com/auto-updates
